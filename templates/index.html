<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <!-- Script oficial do Google -->
    <script src="https://google.com" defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans", "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0b0d; display: flex; justify-content: center; align-items: center; height: 100vh; color: #e3e3e3; overflow: hidden; }

        /* Tela de Login Centralizada */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; animation: fadeIn 0.5s ease; }
        .login-container h1 { font-size: 2.2rem; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .login-container p { color: #80868b; font-size: 1rem; max-width: 320px; line-height: 1.5; }

        /* Container do Botão do Google */
        #botaoGoogleContainer { min-height: 40px; display: flex; align-items: center; justify-content: center; }

        /* Container do Chat (Inicia Escondido) */
        .chat-container { width: 100%; max-width: 800px; height: 90vh; background: #0b0b0d; display: flex; flex-direction: column; position: relative; padding: 0 20px; display: none; }

        .chat-header { padding: 20px 0; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .chat-header h2 { font-size: 1.4rem; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #c4c7c5; }
        .user-profile img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }

        .chat-box { flex: 1; padding: 24px 0 100px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: #282a2d; border-radius: 10px; }

        .message-row { display: flex; flex-direction: column; width: 100%; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .sender-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #c4c7c5; }
        .bot .sender-name { background: linear-gradient(90deg, #669df6, #b08ee0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .msg-text { font-size: 1rem; line-height: 1.6; color: #e3e3e3; white-space: pre-wrap; }
        .user { align-items: flex-end; }
        .user .msg-text { background-color: #1e1e24; padding: 12px 20px; border-radius: 20px; max-width: 85%; }

        .thinking .msg-text { background: linear-gradient(90deg, #4285f4, #9b72cb, #4285f4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { background-position: 0% center; opacity: 0.6; } 50% { background-position: 100% center; opacity: 1; } 100% { background-position: 0% center; opacity: 0.6; } }

        .input-wrapper { position: absolute; bottom: 20px; left: 20px; right: 20px; background: #0b0b0d; padding-top: 10px; }
        .chat-input-area { display: flex; background: #1e1e24; border-radius: 32px; padding: 6px 12px 6px 24px; align-items: center; border: 1px solid transparent; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .chat-input-area:focus-within { background: #131314; border-color: #4285f4; box-shadow: 0 0 0 1px #4285f4; }
        .chat-input-area input { flex: 1; padding: 14px 0; background: transparent; border: none; color: #f2f2f2; font-size: 1rem; outline: none; }
        .chat-input-area input::placeholder { color: #80868b; }

        .chat-input-area button { background: transparent; color: #a8c7fa; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .chat-input-area button:hover { background: rgba(168, 199, 250, 0.1); }
        .chat-input-area button svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-container" id="loginScreen">
    <h1>Gemini Advanced</h1>
    <p id="textoStatus">Faça login com sua conta do Google para começar a buildar seus projetos.</p>
    
    <!-- Elemento limpo onde o botão SERÁ injetado pelo JavaScript -->
    <div id="botaoGoogleContainer"></div>
</div>

<!-- CONTAINER DO CHAT -->
<div class="chat-container" id="chatScreen">
    <div class="chat-header">
        <h2>Gemini Advanced</h2>
        <div class="user-profile" id="userProfile"></div>
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message-row bot">
            <div class="sender-name">Gemini</div>
            <div class="msg-text">E aí, beleza? Conta pra mim, qual é o trampo ou o bug que a gnt vai resolver hoje?</div>
        </div>
    </div>
    
    <div class="input-wrapper">
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite uma mensagem..." onkeypress="verificarEnter(event)">
            <button onclick="enviarMensagem()">
                <svg viewBox="0 -960 960 960"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    // Inicialização forçada do Google Identity Services por JavaScript
    window.onload = function () {
        try {
            google.accounts.id.initialize({
                client_id: "://googleusercontent.com",
                callback: manipularLoginGoogle
            });

            google.accounts.id.renderButton(
                document.getElementById("botaoGoogleContainer"),
                { theme: "filled_blue", size: "large", type: "standard", shape: "pill", text: "signin_with" }
            );
        } catch (erro) {
            document.getElementById("textoStatus").innerText = "Erro ao carregar o botão de login. Se você usa AdBlock ou Brave, desative-os para este site.";
            document.getElementById("textoStatus").style.color = "#ff4a4a";
            console.error(erro);
        }
    };

    function manipularLoginGoogle(response) {
        const id_token = response.credential;
        const payload = JSON.parse(atob(id_token.split('.')));
        
        document.getElementById('userProfile').innerHTML = `
            <span>${payload.name}</span>
            <img src="${payload.picture}" alt="Foto de perfil">
        `;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
    }

    async function enviarMensagem() {
        const input = document.getElementById('userInput');
        const mensagem = input.value.trim();
        if (!mensagem) return;

        input.value = '';
        adicionarMessageNaTela(mensagem, 'user');

        const botMsgDiv = adicionarMessageNaTela('Analisando contexto...', 'bot');
        botMsgDiv.classList.add('thinking');

        try {
            const response = await fetch('/enviar_mensagem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: mensagem })
            });

            const dados = await response.json();
            botMsgDiv.classList.remove('thinking');
            
            if (response.ok) {
                botMsgDiv.querySelector('.msg-text').innerText = dados.resposta;
            } else {
                botMsgDiv.querySelector('.msg-text').innerText = "Erro interno: " + dados.erro;
            }
        } catch (erro) {
            botMsgDiv.classList.remove('thinking');
            botMsgDiv.querySelector('.msg-text').innerText = "Erro ao conectar com o servidor.";
        }
    }

    function adicionarMessageNaTela(texto, remetente) {
        const chatBox = document.getElementById('chatBox');
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${remetente}`;
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'sender-name';
        nameDiv.innerText = remetente === 'user' ? 'Você' : 'Gemini';
        
        const textDiv = document.createElement('div');
        textDiv.className = 'msg-text';
        textDiv.innerText = texto;
        
        if (remetente === 'bot') rowDiv.appendChild(nameDiv);
        rowDiv.appendChild(textDiv);
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return rowDiv;
    }

    function verificarEnter(event) {
        if (event.key === 'Enter') enviarMensagem();
    }
</script>
</body>
</html>
