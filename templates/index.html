<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini</title>
    <style>
        /* Reset e Estilos de Base (Padrão Google) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0d; display: flex; justify-content: center; align-items: center; height: 100vh; color: #e3e3e3; overflow: hidden; }

        /* Container Principal do Gemini */
        .chat-container { width: 100%; max-width: 800px; height: 90vh; background: #0b0b0d; display: flex; flex-direction: column; position: relative; padding: 0 20px; }

        /* Cabeçalho Minimalista com Efeito Gemini */
        .chat-header { padding: 20px 0; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .chat-header h2 { font-size: 1.4rem; font-weight: 500; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Área de Conversa */
        .chat-box { flex: 1; padding: 20px 0 100px 0; overflow-y: auto; display: flex; flex-direction: column; gap: 32px; }
        
        /* Scrollbar Invisível Estilo Web Moderna */
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-track { background: transparent; }
        .chat-box::-webkit-scrollbar-thumb { background: #282a2d; border-radius: 10px; }

        /* Estrutura das Mensagens Sem Balões Pesados */
        .message-row { display: flex; flex-direction: column; width: 100%; animation: fadeIn 0.4s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* Identificadores de Quem Fala (Estilo Google) */
        .sender-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #c4c7c5; letter-spacing: 0.5px; }
        .bot .sender-name { background: linear-gradient(90deg, #669df6, #b08ee0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Conteúdo do Texto */
        .msg-text { font-size: 1rem; line-height: 1.6; color: #e3e3e3; white-space: pre-wrap; max-width: 100%; }
        
        /* Customização da Mensagem do Usuário */
        .user { align-items: flex-end; }
        .user .msg-text { background-color: #1e1e24; padding: 12px 20px; border-radius: 20px; max-width: 85%; color: #e3e3e3; }

        /* Efeito de Carregamento Brilhante (Sparkle) */
        .thinking .msg-text { color: #888888; font-style: normal; animation: pulse 1.5s infinite ease-in-out; background: linear-gradient(90deg, #4285f4, #9b72cb, #4285f4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% auto; }
        @keyframes pulse { 0% { background-position: 0% center; opacity: 0.6; } 50% { background-position: 100% center; opacity: 1; } 100% { background-position: 0% center; opacity: 0.6; } }

        /* Barra de Input Flutuante Arredondada (Fundo Fixo Embaixo) */
        .input-wrapper { position: absolute; bottom: 20px; left: 20px; right: 20px; background: #0b0b0d; padding-top: 10px; }
        .chat-input-area { display: flex; background: #1e1e24; border-radius: 32px; padding: 6px 12px 6px 24px; align-items: center; border: 1px solid transparent; transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        
        /* Borda Colorida Dinâmica ao Clicar (Efeito Gemini Active) */
        .chat-input-area:focus-within { background: #131314; border-color: #4285f4; box-shadow: 0 0 0 1px #4285f4, 0 12px 30px rgba(0,0,0,0.4); }

        .chat-input-area input { flex: 1; padding: 14px 0; background: transparent; border: none; color: #f2f2f2; font-size: 1rem; outline: none; }
        .chat-input-area input::placeholder { color: #80868b; }

        /* Botão Enviar Circular Ícone */
        .chat-input-area button { background: transparent; color: #a8c7fa; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .chat-input-area button:hover { background: rgba(168, 199, 250, 0.1); color: #c4dedb; }
        .chat-input-area button svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>Gemini Advanced</h2>
    </div>
    
    <div class="chat-box" id="chatBox">
        <!-- Mensagem Inicial Estilo Google -->
        <div class="message-row bot">
            <div class="sender-name">Gemini</div>
            <div class="msg-text">E aí, beleza? Sou seu parceiro de desenvolvimento. O que a gente vai buildar ou arrumar nesse código hoje? Manda a braba.</div>
        </div>
    </div>
    
    <div class="input-wrapper">
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite um comando ou pergunta..." onkeypress="verificarEnter(event)">
            <button onclick="enviarMensagem()" title="Enviar mensagem">
                <!-- Ícone de seta minimalista do Material Design -->
                <svg viewBox="0 -960 960 960"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    async function enviarMensagem() {
        const input = document.getElementById('userInput');
        const mensagem = input.value.trim();
        if (!mensagem) return;

        input.value = '';
        adicionarMensagemNaTela(mensagem, 'user');

        // Cria o efeito de texto brilhante dinâmico simulando o processamento do Gemini
        const botMsgDiv = adicionarMensagemNaTela('Analisando contexto...', 'bot');
        botMsgDiv.classList.add('thinking');

        try {
            const response = await fetch('/enviar_mensagem', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mensagem: mensagem })
            });

            const dados = await response.json();
            botMsgDiv.classList.remove('thinking');
            
            if (response.ok) {
                // Atualiza o container interno mantendo a formatação limpa do Gemini
                botMsgDiv.querySelector('.msg-text').innerText = dados.resposta;
            } else {
                botMsgDiv.querySelector('.msg-text').style.color = "#ececec";
                botMsgDiv.querySelector('.msg-text').innerText = "Putz, deu algum erro interno aqui: " + dados.erro;
            }
        } catch (erro) {
            botMsgDiv.classList.remove('thinking');
            botMsgDiv.querySelector('.msg-text').style.color = "#da6570";
            botMsgDiv.querySelector('.msg-text').innerText = "Ih, deu ruim na rede. Não consegui conectar com o servidor.";
        }
    }

    function adicionarMensagemNaTela(texto, remetente) {
        const chatBox = document.getElementById('chatBox');
        
        // Estrutura de linhas fluidas igual à do app oficial
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${remetente}`;
        
        const nameDiv = document.createElement('div');
        nameDiv.className = 'sender-name';
        nameDiv.innerText = remetente === 'user' ? 'Você' : 'Gemini';
        
        const textDiv = document.createElement('div');
        textDiv.className = 'msg-text';
        textDiv.innerText = texto;
        
        // No Gemini oficial, o nome do usuário não aparece sobre o balão, apenas o texto encapsulado
        if (remetente === 'bot') {
            rowDiv.appendChild(nameDiv);
        }
        rowDiv.appendChild(textDiv);
        
        chatBox.appendChild(rowDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return rowDiv;
    }

    function verificarEnter(event) {
        if (event.key === 'Enter') enviarMensagem();
    }
</script>
</body>
</html>
