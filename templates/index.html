<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Advanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Cabeçalho */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background-color: #1e1f20;
            border-bottom: 1px solid #2d2f31;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4285f4;
        }

        .btn-google {
            background-color: #ffffff;
            color: #1f1f1f;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease;
        }

        .btn-google:hover {
            background-color: #e3e3e3;
        }

        /* Conteúdo do Chat */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-sender {
            font-size: 0.75rem;
            color: #8e918f;
            margin-bottom: 4px;
        }

        .message-bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background-color: #27292a;
            color: #e3e3e3;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background-color: #1e1f20;
            border: 1px solid #2d2f31;
            color: #e3e3e3;
            border-bottom-left-radius: 4px;
        }

        /* Área de Input */
        .input-wrapper {
            padding: 16px 24px 24px 24px;
            background-color: #131314;
        }

        .input-container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            background-color: #1e1f20;
            border: 1px solid #3c4043;
            border-radius: 28px;
            padding: 8px 16px;
            transition: border-color 0.2s ease;
        }

        .input-container:focus-within {
            border-color: #8ab4f8;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            padding: 8px 0;
        }

        .btn-send {
            background: #8ab4f8;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 8px;
            transition: opacity 0.2s ease;
        }

        .btn-send:hover {
            opacity: 0.85;
        }

        .btn-send svg {
            fill: #040e15;
            width: 18px;
            height: 18px;
        }

        /* Indicador de carregamento */
        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #8ab4f8;
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Gemini Advanced</div>
        <div class="user-profile">
            {% if session.get('usuario_logado') %}
                <span style="font-size: 0.9rem; font-weight: 500;">{{ session.get('usuario_nome') }}</span>
                {% if session.get('usuario_foto') %}
                    <img src="{{ session.get('usuario_foto') }}" alt="Foto do perfil" class="user-avatar">
                {% endif %}
            {% else %}
                <a href="{{ url_google }}" class="btn-google">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Entrar com o Google
                </a>
            {% endif %}
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <span class="message-sender">Gemini</span>
            <div class="message-bubble">E aí! Qual é a boa de hoje? Manda a braba.</div>
        </div>
    </div>

    <div class="input-wrapper">
        <div class="input-container">
            <textarea id="mensagemInput" rows="1" placeholder="Digite uma mensagem..."></textarea>
            <button class="btn-send" id="btnEnviar">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const mensagemInput = document.getElementById('mensagemInput');
        const btnEnviar = document.getElementById('btnEnviar');

        // Ajusta a altura da caixa de texto conforme o usuário digita
        mensagemInput.addEventListener('input', () => {
            mensagemInput.style.height = 'auto';
            mensagemInput.style.height = mensagemInput.scrollHeight + 'px';
        });

        // Envia mensagem ao pressionar Enter
        mensagemInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviarMensagem();
            }
        });

        btnEnviar.addEventListener('click', enviarMensagem);

        async function enviarMensagem() {
            const texto = mensagemInput.value.trim();
            if (!texto) return;

            adicionarMensagem('user', 'Você', texto);
            mensagemInput.value = '';
            mensagemInput.style.height = 'auto';

            // Adiciona o indicador de carregamento
            const loadingId = adicionarCarregamento();

            try {
                const response = await fetch('/enviar_mensagem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: texto })
                });

                const data = await response.json();
                removerCarregamento(loadingId);

                if (response.ok) {
                    adicionarMensagem('assistant', 'Gemini', data.resposta);
                } else {
                    adicionarMensagem('assistant', 'Gemini', 'Erro: ' + (data.erro || 'Erro desconhecido.'));
                }
            } catch (err) {
                removerCarregamento(loadingId);
                adicionarMensagem('assistant', 'Gemini', 'Erro de conexão com o servidor.');
            }
        }

        function adicionarMensagem(tipo, autor, texto) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${tipo}`;

            const senderSpan = document.createElement('span');
            senderSpan.className = 'message-sender';
            senderSpan.textContent = autor;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.textContent = texto;

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bubbleDiv);

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function adicionarCarregamento() {
            const id = 'loading-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.id = id;

            const senderSpan = document.createElement('span');
            senderSpan.className = 'message-sender';
            senderSpan.textContent = 'Gemini';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = `
                <div class="loading-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>`;

            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(bubbleDiv);

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removerCarregamento(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
